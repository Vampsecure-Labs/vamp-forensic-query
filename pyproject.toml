[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vamp-forensic-query"
version = "1.1"
description = "Forensic SQL/log query engine for authorized digital investigations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "forensics", "sqlite", "log-analysis", "dfir"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []


[project.scripts]
vamp-forensic-query = "vamp_forensic_query:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-forensic-query"
Repository = "https://github.com/Vampsecure-Labs/vamp-forensic-query"

[tool.setuptools]
py-modules = ["vamp_forensic_query"]
